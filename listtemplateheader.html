<script>
// Einmal pro Sitzung auf 1000 Eintraege pro Seite umstellen, damit die
// Matrix immer alle Rueckmeldungen enthaelt. Das Flag wird VOR dem Reload
// gesetzt - sonst laeuft der Code in einer Endlosschleife.
(() => {
  'use strict';
  if (typeof sessionStorage === 'undefined') return;
  if (sessionStorage.getItem('tfPerPageReload') !== null) return;
  const params = new URLSearchParams(location.search);
  if (params.get('perpage') === '1000') {
    sessionStorage.setItem('tfPerPageReload', '1');
    return;
  }
  params.set('perpage', '1000');
  sessionStorage.setItem('tfPerPageReload', '1');
  window.location.replace(`${location.pathname}?${params}`);
})();
</script>
