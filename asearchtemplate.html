<div class="tf-app tf-search">
  <div class="tf-panel">
    <div class="tf-panel__bar">Filter</div>
    <div class="tf-panel__body">

      <p class="tf-card-title">R&uuml;ckmeldungen durchsuchen</p>
      <p class="tf-subtitle" style="margin-bottom:14px">Nach Personen oder Inhalten der Notizen suchen.</p>

      <div class="tf-search-grid">
        <div>
          <span class="tf-label">Vorname</span>
          ##firstname##
        </div>
        <div>
          <span class="tf-label">Nachname</span>
          ##lastname##
        </div>
        <div>
          <span class="tf-label">Notiz</span>
          [[note]]
        </div>
        <div>
          <span class="tf-label">Tags</span>
          ##tags##
        </div>
      </div>

    </div>
  </div>
</div>
