<div class="tf-app tf-add">

  <div id="tf-source" class="tf-hidden">[[events]]</div>
  <div id="tf-json-source" class="tf-hidden">[[json]]</div>

  <div class="tf-panel">
    <div class="tf-panel__bar">Terminabstimmung</div>
    <div class="tf-panel__body">

      <div class="tf-panel__head">
        <div>
          <p class="tf-card-title">Deine Verf&uuml;gbarkeit</p>
          <p class="tf-subtitle">W&auml;hle f&uuml;r jeden Termin aus, ob du kannst. Ein zweiter Klick hebt die Auswahl wieder auf.</p>
        </div>
        <div class="tf-progress" id="tf-progress" hidden>
          <span class="tf-progress__label"><span id="tf-progress-done">0</span> von <span id="tf-progress-total">0</span> beantwortet</span>
          <div class="tf-progress__track"><div class="tf-progress__bar" id="tf-progress-bar"></div></div>
        </div>
      </div>

      <div id="tf-add-body"></div>

      <div class="tf-notefield">
        <span class="tf-label">[[note#description]]</span>
        [[note]]
      </div>

    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  const STATUS_OPTIONS = [
    { key: 'yes',   symbol: '\u2713', label: 'Kann',       cls: 'yes' },
    { key: 'maybe', symbol: '?',      label: 'Vielleicht', cls: 'maybe' },
    { key: 'no',    symbol: '\u2717', label: 'Kann nicht', cls: 'no' }
  ];

  // Drei erlaubte Formen: Zeitpunkt, Zeitraum und ganztaegig. Die Stunden- und
  // Minutenbereiche stehen bewusst im Muster - mit \d{2} waere 25:00 gueltig.
  const DAY   = '\\d{4}-\\d{2}-\\d{2}';
  const CLOCK = '(?:[01]\\d|2[0-3]):[0-5]\\d';
  const DATE_TIME_PATTERN = new RegExp(`^${DAY}T${CLOCK}$`);
  const RANGE_PATTERN     = new RegExp(`^${DAY}T${CLOCK}-${CLOCK}$`);
  const ALL_DAY_PATTERN   = new RegExp(`^${DAY}$`);
  const TIME_RANGE        = /^(\d{2}:\d{2})-(\d{2}:\d{2})$/;
  const ALL_DAY_LABEL     = 'ganzt\u00e4gig';
  const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const MONTHS   = ['Jan', 'Feb', 'M\u00e4r', 'Apr', 'Mai', 'Jun',
                    'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

  const isAllDay = (dateTime) => !dateTime.includes('T');

  // Auch der Kalendertag wird geprueft: 2026-02-30 passt zwar auf das Muster,
  // existiert aber nicht.
  const isRealDay = (isoDay) => {
    const [y, m, d] = isoDay.split('-').map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
  };

  const isValidDate = (value) => {
    if (!ALL_DAY_PATTERN.test(value) && !DATE_TIME_PATTERN.test(value) &&
        !RANGE_PATTERN.test(value)) return false;
    if (!isRealDay(value.split('T')[0])) return false;
    if (!RANGE_PATTERN.test(value)) return true;
    // Bei einem Zeitraum muss das Ende nach dem Anfang liegen, sonst ist der
    // Eintrag ein Tippfehler und keine gueltige Angabe.
    const [start, end] = TIME_RANGE.exec(value.split('T')[1]).slice(1);
    return end > start;
  };

  // Zeitraeume werden mit Halbgeviertstrich angezeigt, Zeitpunkte unveraendert.
  const formatTime = (time) => {
    const parts = TIME_RANGE.exec(time);
    return parts ? `${parts[1]}\u2013${parts[2]}` : time;
  };

  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));

  const dayParts = (isoDay) => {
    const [year, month, day] = isoDay.split('-').map(Number);
    const date = new Date(Date.UTC(year, month - 1, day));
    const dow = date.getUTCDay();
    return {
      dow: WEEKDAYS[dow],
      num: String(day).padStart(2, '0'),
      mon: MONTHS[month - 1],
      year: String(year),
      weekend: dow === 0 || dow === 6
    };
  };

  const container    = document.getElementById('tf-add-body');
  const sourceSelect = document.querySelector('#tf-source select');
  const jsonInput    = document.querySelector('#tf-json-source input, #tf-json-source textarea');

  if (!container) return;

  if (!sourceSelect || !jsonInput) {
    // Konfigurationsproblem (z. B. Feld umbenannt oder geloescht) sichtbar
    // machen, statt eine leere, verwirrende Seite zu hinterlassen.
    container.innerHTML = '<div class="tf-alert tf-alert--danger"><span class="tf-alert__icon">\u26A0</span>' +
      '<div><strong>Terminfinder:</strong> Die erwarteten Felder wurden nicht gefunden. ' +
      'Bitte pr\u00fcfen, ob die Felder <code>events</code> und <code>json</code> existieren.</div></div>';
    return;
  }

  // Terminliste aus dem versteckten Auswahlfeld lesen.
  const dateList = [];
  const invalidEntries = [];
  const duplicateEntries = [];
  const seen = new Set();

  for (const option of sourceSelect.options) {
    const value = (option.value || '').trim();
    if (!value) continue;
    if (!isValidDate(value)) { invalidEntries.push(value); continue; }
    if (seen.has(value))     { duplicateEntries.push(value); continue; }
    seen.add(value);
    dateList.push(value);
  }
  dateList.sort();

  let warningHtml = '';
  if (invalidEntries.length > 0 || duplicateEntries.length > 0) {
    warningHtml += '<div class="tf-alert tf-alert--warn"><span class="tf-alert__icon">\u26A0</span><div>';
    if (invalidEntries.length > 0) {
      const items = invalidEntries.map((v) => `<code>${escapeHtml(v)}</code>`).join(', ');
      warningHtml += `<div>${invalidEntries.length} Eintrag/Eintr\u00e4ge im Feld ` +
        `\u201eTermine\u201c entspricht/entsprechen keinem der erlaubten Formate und ` +
        `wird/werden daher nicht angezeigt: ${items}` +
        `<br>Erlaubt sind <code>JJJJ-MM-TT` + `T` + `HH:MM</code> f\u00fcr einen Zeitpunkt ` +
        `(z.\u00A0B. <code>2026-06-15T12:00</code>), <code>JJJJ-MM-TT` + `T` + `HH:MM-HH:MM</code> ` +
        `f\u00fcr einen Zeitraum (z.\u00A0B. <code>2026-06-15T10:00-11:30</code>) und ` +
        `<code>JJJJ-MM-TT</code> f\u00fcr einen ganzt\u00e4gigen Termin. Bei einem Zeitraum ` +
        `muss das Ende nach dem Anfang liegen.</div>`;
    }
    if (duplicateEntries.length > 0) {
      const items = duplicateEntries.map((v) => `<code>${escapeHtml(v)}</code>`).join(', ');
      warningHtml += `<div${invalidEntries.length > 0 ? ' style="margin-top:.5rem"' : ''}>` +
        `Folgender Termin ist mehrfach eingetragen und wird nur einmal angezeigt: ${items}</div>`;
    }
    warningHtml += '</div></div>';
  }

  if (dateList.length === 0) {
    container.innerHTML = warningHtml +
      '<div class="tf-empty">Es sind noch keine Termine hinterlegt.<br>' +
      'Der Organisator pflegt sie in den Optionen des Feldes \u201eevents\u201c.</div>';
    return;
  }

  // Vorhandene Antwort laden, z. B. beim Bearbeiten eines Eintrags.
  let existingAnswers = {};
  try {
    existingAnswers = JSON.parse(jsonInput.value || '{}') || {};
  } catch (parseError) {
    existingAnswers = {};
  }

  // Sammel-Buttons: setzen bzw. loeschen eine ganze Statusspalte auf einmal.
  const bulkHtml = '<div class="tf-bulk">' +
    '<span class="tf-bulk__label">Alle Termine:</span>' +
    STATUS_OPTIONS.map((status) =>
      `<button type="button" class="tf-bulk__btn" data-status="${status.key}" aria-pressed="false" ` +
      `title="Alle Termine auf \u201e${status.label}\u201c setzen bzw. wieder abw\u00e4hlen">` +
      `<span aria-hidden="true">${status.symbol}</span> ${status.label}</button>`
    ).join('') +
    '</div>';

  // Nach Kalendertag gruppieren, damit mehrere Slots eines Tages eine Karte teilen.
  const dayGroups = new Map();
  for (const dateTime of dateList) {
    const day = dateTime.split('T')[0];
    if (!dayGroups.has(day)) dayGroups.set(day, []);
    dayGroups.get(day).push(dateTime);
  }

  const dayCards = [...dayGroups.keys()].sort().map((day) => {
    const parts = dayParts(day);
    const slots = dayGroups.get(day).map((dateTime) => {
      const slotId = dateTime.replace(/[^0-9]/g, '');
      const current = existingAnswers[dateTime];

      const timeLabel = isAllDay(dateTime)
        ? `<span class="tf-allday">${ALL_DAY_LABEL}</span>`
        : `${formatTime(dateTime.split('T')[1])} Uhr`;

      // Bewusst Checkboxen statt Radios: Das native Klickverhalten schaltet
      // beim zweiten Klick wieder aus - damit ist "einzeln abwaehlen" gratis.
      // Die Exklusivitaet je Zeile erzwingt der change-Handler weiter unten.
      const segments = STATUS_OPTIONS.map((status) => {
        const inputId = `tf_${slotId}_${status.key}`;
        const checked = current === status.key ? ' checked' : '';
        return `<input type="checkbox" class="tf-seg__input tf-check" autocomplete="off" id="${inputId}" ` +
          `data-datetime="${dateTime}" data-status="${status.key}"${checked}>` +
          `<label class="tf-seg__btn tf-seg__btn--${status.cls}" for="${inputId}" ` +
          `title="${status.label}" aria-label="${status.label}">` +
          `<span class="tf-seg__sym" aria-hidden="true">${status.symbol}</span>` +
          `<span class="tf-seg__txt">${status.label}</span></label>`;
      }).join('');

      return `<div class="tf-slot" data-datetime="${dateTime}">` +
        `<span class="tf-slot__time">${timeLabel}</span>` +
        `<div class="tf-seg" role="group" aria-label="Antwort f\u00fcr ${dateTime}">${segments}</div>` +
        `</div>`;
    }).join('');

    return `<div class="tf-day${parts.weekend ? ' tf-day--weekend' : ''}">` +
      `<div class="tf-day__date" aria-hidden="true">` +
      `<span class="tf-day__mon">${parts.mon} ${parts.year}</span>` +
      `<span class="tf-day__num">${parts.num}</span>` +
      `<span class="tf-day__dow">${parts.dow}</span>` +
      `</div>` +
      `<div class="tf-day__slots">${slots}</div>` +
      `</div>`;
  }).join('');

  // Die Tageskarten bekommen einen eigenen Container: sonst wuerden Warnhinweis
  // und Sammel-Buttons bei der Wechselfaerbung mitgezaehlt.
  container.innerHTML = warningHtml + bulkHtml + `<div class="tf-days">${dayCards}</div>`;

  // Elemente einmal einsammeln statt bei jeder Aenderung neu zu suchen.
  const checkboxes = [...container.querySelectorAll('.tf-check')];
  const bulkButtons = [...container.querySelectorAll('.tf-bulk__btn')];
  const labelFor = new Map(
    checkboxes.map((cb) => [cb, container.querySelector(`label[for="${cb.id}"]`)])
  );

  const progressWrap  = document.getElementById('tf-progress');
  const progressBar   = document.getElementById('tf-progress-bar');
  const progressDone  = document.getElementById('tf-progress-done');
  const progressTotal = document.getElementById('tf-progress-total');

  if (progressWrap) {
    progressWrap.hidden = false;
    progressTotal.textContent = String(dateList.length);
  }

  // Der ausgewaehlte Zustand wird bewusst selbst als Klasse gesetzt, damit das
  // Aussehen nicht vom jeweiligen Moodle-Theme abhaengt.
  const syncVisuals = () => {
    let answered = 0;
    for (const checkbox of checkboxes) {
      const label = labelFor.get(checkbox);
      if (label) label.classList.toggle('is-active', checkbox.checked);
      if (checkbox.checked) answered += 1;
    }
    if (progressWrap) {
      progressDone.textContent = String(answered);
      progressBar.style.width = dateList.length
        ? `${Math.round((answered / dateList.length) * 100)}%`
        : '0%';
    }
  };

  const syncAnswersToHiddenField = () => {
    const answers = {};
    for (const checkbox of checkboxes) {
      if (checkbox.checked) answers[checkbox.dataset.datetime] = checkbox.dataset.status;
    }
    // Termine ohne Auswahl als "offen" (null) mitschreiben, damit die
    // Listenansicht immer den vollstaendigen Spaltensatz sieht.
    for (const dateTime of dateList) {
      if (!(dateTime in answers)) answers[dateTime] = null;
    }
    jsonInput.value = JSON.stringify(answers);
  };

  // "Nur ein Status pro Zeile" manuell erzwingen, da wir nicht mehr auf die
  // native Exklusivitaet von Radio-Gruppen setzen.
  const clearRowExcept = (dateTime, keepCheckbox) => {
    for (const checkbox of checkboxes) {
      if (checkbox !== keepCheckbox && checkbox.dataset.datetime === dateTime) {
        checkbox.checked = false;
      }
    }
  };

  const updateBulkStates = () => {
    for (const button of bulkButtons) {
      const columnBoxes = checkboxes.filter((cb) => cb.dataset.status === button.dataset.status);
      const allActive = columnBoxes.length > 0 && columnBoxes.every((cb) => cb.checked);
      button.classList.toggle('is-active', allActive);
      button.setAttribute('aria-pressed', allActive ? 'true' : 'false');
    }
  };

  const refresh = () => {
    syncAnswersToHiddenField();
    syncVisuals();
    updateBulkStates();
  };

  checkboxes.forEach((checkbox) => {
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) clearRowExcept(checkbox.dataset.datetime, checkbox);
      refresh();
    });
  });

  bulkButtons.forEach((button) => {
    button.addEventListener('click', () => {
      const columnBoxes = checkboxes.filter((cb) => cb.dataset.status === button.dataset.status);
      const allActive = columnBoxes.length > 0 && columnBoxes.every((cb) => cb.checked);
      if (allActive) {
        // Zweiter Klick auf eine vollstaendig aktive Spalte: wieder abwaehlen.
        columnBoxes.forEach((cb) => { cb.checked = false; });
      } else {
        columnBoxes.forEach((cb) => {
          cb.checked = true;
          clearRowExcept(cb.dataset.datetime, cb);
        });
      }
      refresh();
    });
  });

  const form = jsonInput.closest('form');
  if (form) form.addEventListener('submit', syncAnswersToHiddenField);

  refresh();
})();
</script>
